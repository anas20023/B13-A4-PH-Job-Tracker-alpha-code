<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="./jobs.png" type="image/x-icon" />
        <link
            href="https://cdn.jsdelivr.net/npm/daisyui@5"
            rel="stylesheet"
            type="text/css" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
            rel="stylesheet"
            type="text/css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer" />
        <title>Job Tracker</title>
    </head>
    <body class="font-[Geist] bg-base-200 min-h-screen">
        <header class="max-w-6xl mx-auto p-4">
            <h1 class="text-2xl font-bold text-[#002C5C]">
                Job Application Tracker
            </h1>
            <div class="container grid grid-cols-1 md:grid-cols-3 py-4 gap-4">
                <div class="bg-white rounded outline-2 outline-slate-100 p-5">
                    <h1 class="text-lg font-semibold text-[#323B49]">Total</h1>
                    <p class="text-2xl font-bold text-[#002C5C] total_count">
                        0
                    </p>
                </div>
                <div class="bg-white rounded outline-2 outline-slate-100 p-5">
                    <h1 class="text-lg font-semibold text-[#323B49]">
                        Interview
                    </h1>
                    <p class="text-2xl font-bold text-success interview_count">
                        0
                    </p>
                </div>
                <div class="bg-white rounded outline-2 outline-slate-100 p-5">
                    <h1 class="text-lg font-semibold text-[#323B49]">
                        Rejected
                    </h1>
                    <p class="text-2xl font-bold text-error reject_count">0</p>
                </div>
            </div>
        </header>
        <section class="max-w-6xl mx-auto p-4">
            <div class="flex flex-row justify-between items-center">
                <h1 class="font-bold text-lg text-[#002C5C]">Available Jobs</h1>
                <p id="smallCounter" class="text-[#002C5C]">0 jobs</p>
            </div>
            <div class="flex flex-row justify-start items-center gap-4 my-4">
                <button id="allbtn" class="nosto-btn btn btn-primary">All</button>
                <button id="interviewbtn" class="nosto-btn btn">Interview</button>
                <button id="rejectbtn" class="nosto-btn btn">Rejected</button>
            </div>
            <div
                id="job_container"
                class="py-4 my-2 rounded grid grid-cols-1 gap-4"> 
            </div>
        </section>
        <script src="./scripts/machine.js"></script>
        <script src="./scripts/data.js"></script>
        <script src="./scripts/index.js"></script>
        <script src="./scripts/switch.js"></script>
    </body>
</html>
